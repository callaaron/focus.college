# Cloudflare Pages Configuration
name = "focus-college"
compatibility_date = "2024-01-01"

# Pages Configuration
pages_build_output_dir = "dist/public"

[build]
command = "npm run build"

[build.environment]
NODE_VERSION = "22"

# D1 Database Configuration
# After creating D1 database with: npx wrangler d1 create focus-college-db
# Update the database_id below with the actual ID from the output
[[d1_databases]]
binding = "DB"
database_name = "focus-college-db"
database_id = "PLACEHOLDER_REPLACE_AFTER_CREATION"

# Preview D1 Database (for branch previews)
# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "focus-college-db-preview"
# database_id = "PLACEHOLDER_REPLACE_AFTER_CREATION"

# Environment Variables
# These should be set in Cloudflare Dashboard: Pages project → Settings → Environment variables
# JWT_SECRET - Your JWT secret key
# VITE_APP_TITLE - Application title
# NODE_ENV - production/development

# Custom domains will be configured in Cloudflare Dashboard
# Go to: Pages project → Custom domains → Add custom domain
